<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arbeitszeitrechner</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Arbeitszeitrechner">

<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#121212">

<style>
body {
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    font-family:Arial;
    background:#121212;
    color:white;
    padding:20px;
}
.container { max-width:450px; width:100%; }
h2 { text-align:center; margin-bottom:25px; }

.section {
    background:#1e1e1e;
    padding:20px;
    border-radius:12px;
    margin-bottom:20px;
}

label {
    display:block;
    text-align:center;
    margin:15px 0 5px;
    font-size:14px;
    color:#bbb;
}

input {
    width:130px;
    padding:8px;
    text-align:center;
    display:block;
    margin:8px auto;
    border-radius:8px;
    border:none;
    font-size:16px;
    background:#2a2a2a;
    color:white;
}

button {
    width:100%;
    padding:14px;
    border-radius:10px;
    border:none;
    font-size:16px;
    background:#4CAF50;
    color:white;
    cursor:pointer;
}

.stunden-buttons {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:10px;
}

.stunden-buttons button {
    background:#2a2a2a;
    border:1px solid #444;
}

.stunden-buttons button.active {
    background:#4CAF50;
}

.result-box {
    margin-top:20px;
    padding:20px;
    background:#1e1e1e;
    border-radius:12px;
    line-height:1.6;
}

.countdown {
    margin-top:15px;
    font-size:20px;
    text-align:center;
    color:#4CAF50;
}

.warn { color:#FFD54F; }
.limit { color:#FF5252; }

</style>
</head>
<body>

<div class="container">
<h2>Arbeitszeitrechner</h2>

<div class="section">

<label>Wochenarbeitszeit</label>
<div class="stunden-buttons">
<button type="button" onclick="setWoche(40,this)" class="active">40 Std</button>
<button type="button" onclick="setWoche(39,this)">39 Std</button>
<button type="button" onclick="setWoche(38,this)">38 Std</button>
<button type="button" onclick="setWoche(37.5,this)">37.5 Std</button>
</div>

<label>Startzeit</label>
<input type="time" id="startTime">

<label>Tatsächlicher Feierabend (optional)</label>
<input type="time" id="endTime">

<button onclick="berechnen()">Berechnen</button>
</div>

<div id="output" class="result-box">
Hier erscheint dein Ergebnis
</div>

<div id="countdown" class="countdown"></div>
</div>

<script>

let wochenStunden = 40;
let countdownInterval;

function setWoche(stunden, el){
    wochenStunden = stunden;
    document.querySelectorAll(".stunden-buttons button")
        .forEach(b=>b.classList.remove("active"));
    el.classList.add("active");
}

function formatTime(d){
    return d.getHours().toString().padStart(2,"0")+":"+
           d.getMinutes().toString().padStart(2,"0");
}

function pauseNachGesetz(nettoMin){
    if(nettoMin > 9*60) return 45;
    if(nettoMin > 6*60) return 30;
    return 0;
}

function startCountdown(target){
    clearInterval(countdownInterval);
    countdownInterval = setInterval(()=>{
        let diff = target - new Date();
        if(diff <= 0){
            document.getElementById("countdown").textContent="Feierabend 🎉";
            clearInterval(countdownInterval);
            return;
        }
        let h=Math.floor(diff/1000/60/60);
        let m=Math.floor(diff/1000/60)%60;
        let s=Math.floor(diff/1000)%60;
        document.getElementById("countdown").textContent=
        `Countdown bis Soll-Feierabend: ${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
    },1000);
}

function berechnen(){

let startInput=document.getElementById("startTime").value;
let endInput=document.getElementById("endTime").value;

if(!startInput){ alert("Bitte Startzeit eingeben"); return; }

let [sh,sm]=startInput.split(":").map(Number);
let start=new Date();
start.setHours(sh,sm,0);

let sollNettoMin=(wochenStunden/5)*60;
let sollPause=pauseNachGesetz(sollNettoMin);
let sollEnde=new Date(start.getTime()+(sollNettoMin+sollPause)*60000);

let plus15=new Date(sollEnde.getTime()+15*60000);

// 10h Netto Grenze
let pause10=pauseNachGesetz(10*60);
let zehnGrenze=new Date(start.getTime()+(10*60+pause10)*60000);

let output=`
Du hast um ${startInput} begonnen.<br><br>
Soll-Feierabend: <b>${formatTime(sollEnde)}</b><br>
+15 Minuten: ${formatTime(plus15)}<br>
<span class="limit">10 Stunden Netto erreicht um:</span> ${formatTime(zehnGrenze)}<br><br>
`;

if(endInput){

let [eh,em]=endInput.split(":").map(Number);
let end=new Date();
end.setHours(eh,em,0);

let bruttoMin=Math.round((end-start)/60000);
let pause=pauseNachGesetz(bruttoMin);
let nettoMin=bruttoMin-pause;

if(pause>0){
output+=`<span class="warn">⚠ ${pause} Minuten Pause wurden automatisch abgezogen.</span><br><br>`;
}

let diff=nettoMin-sollNettoMin;
let dh=Math.floor(Math.abs(diff)/60);
let dm=Math.abs(diff)%60;
let diffText=String(dh).padStart(2,"0")+":"+String(dm).padStart(2,"0");

output+=`
Tatsächlicher Feierabend: ${endInput}<br>
Netto-Arbeitszeit: ${Math.floor(nettoMin/60)}h ${nettoMin%60}min<br><br>
`;

if(diff>0) output+=`Überstunden: +${diffText}`;
else if(diff<0) output+=`Minusstunden: -${diffText}`;
else output+=`Perfekt auf Sollzeit 🎯`;

}

document.getElementById("output").innerHTML=output;
startCountdown(sollEnde);

}

if('serviceWorker' in navigator){
navigator.serviceWorker.register('service-worker.js');
}

</script>

</body>
</html>
